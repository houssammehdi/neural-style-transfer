[project]
name = "neural-style"
version = "1.0.0"
description = "Neural style transfer with PyTorch and VGG-19"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Houssam Mehdi" }]
dependencies = ["torch>=2.1", "torchvision>=0.16", "numpy>=1.24", "pillow>=10"]

[project.optional-dependencies]
# Converting the original Caffe VGG-19 weights (Keras HDF5 release) needs h5py.
caffe = ["h5py>=3.8"]
# Plots in scripts/ (convergence curves).
plots = ["matplotlib>=3.7"]
# Exact pins: formatter, linter and test-runner versions decide what CI accepts.
dev = [
    "pytest==9.1.1",
    "hypothesis==6.168.1",
    "ruff==0.16.9",
    "mypy==2.3.1",
]

[project.scripts]
neural-style = "neural_style.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["neural_style"]

[tool.setuptools.package-data]
neural_style = ["py.typed"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# D1: every public module, class and function has a docstring (magic methods and __init__ excepted).
select = ["E", "F", "I", "UP", "B", "SIM", "D1"]
ignore = ["D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["neural_style", "tests", "scripts"]

[[tool.mypy.overrides]]
# Neither ships type information.
module = ["h5py", "torchvision", "torchvision.*"]
ignore_missing_imports = true
